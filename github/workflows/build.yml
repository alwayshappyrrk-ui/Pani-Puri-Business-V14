name: Build Pani Puri Business V14.2 V4

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Enable AndroidX
        run: |
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Find Android Project
        id: project
        shell: bash
        run: |
          PROJECT_DIR=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1 | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Make Gradle Wrapper
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          gradle wrapper --gradle-version 8.7

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace

      - name: Find APK
        id: apk
        shell: bash
        run: |
          APK=$(find "${{ steps.project.outputs.project_dir }}" \
            -type f \
            -name "*.apk" \
            | grep "/outputs/apk/" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK not found"
            find . -type f -name "*.apk"
            exit 1
          fi

          echo "APK found: $APK"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        shell: bash
        run: |
          cp "${{ steps.apk.outputs.apk_path }}" \
          "Pani-Puri-Business-V14.2-V4-FIXED.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pani-Puri-Business-V14.2-V4-FIXED
          path: Pani-Puri-Business-V14.2-V4-FIXED.apk
          if-no-files-found: error
