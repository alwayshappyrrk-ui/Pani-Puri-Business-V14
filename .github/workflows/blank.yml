name: Build Pani Puri Business V14.2 V4

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK V14.2 V4
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract V4 ZIP
        shell: bash
        run: |
          set -e
          ZIP=$(find . -maxdepth 2 -type f -name 'Pani-Puri-Business-V14.2-V4.10-GOOGLE-DRIVE-SYNC-FIXED.zip' -print -quit)
          if [ -z "$ZIP" ]; then
            echo "ERROR: V4 ZIP not found."
            find . -type f -name '*.zip' -print
            exit 1
          fi

          echo "Found ZIP: $ZIP"

          mkdir -p extracted

          unzip -q "$ZIP" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | head -100

      - name: Locate Android Project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find extracted -type f -name settings.gradle -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle not found after ZIP extraction."
            find extracted -type f | head -200
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Verify V14.2 Source
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          test -f app/build.gradle || {
            echo "ERROR: app/build.gradle not found"
            exit 1
          }

          test -f app/src/main/AndroidManifest.xml || {
            echo "ERROR: AndroidManifest.xml not found"
            exit 1
          }

          test -f app/src/main/java/com/panipuri/business/MainActivity.java || {
            echo "ERROR: MainActivity.java not found"
            exit 1
          }

          test -f app/src/main/assets/index.html || {
            echo "ERROR: index.html not found"
            exit 1
          }

          echo "V14.2 source verification OK."

      - name: Configure AndroidX
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          touch gradle.properties

          grep -qxF 'android.useAndroidX=true' gradle.properties || \
            echo 'android.useAndroidX=true' >> gradle.properties

          grep -qxF 'android.enableJetifier=true' gradle.properties || \
            echo 'android.enableJetifier=true' >> gradle.properties

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew clean assembleDebug --no-daemon --stacktrace
          else
            gradle clean assembleDebug --no-daemon --stacktrace
          fi

      - name: Locate and Rename APK
        shell: bash
        run: |
          set -e

          APK=$(find "${{ env.PROJECT_DIR }}" \
            -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            find "${{ env.PROJECT_DIR }}" -type f -name '*.apk' -print || true
            exit 1
          fi

          cp "$APK" "${GITHUB_WORKSPACE}/Pani-Puri-Business-V14.2-V4.apk"

          ls -lh "${GITHUB_WORKSPACE}/Pani-Puri-Business-V14.2-V4.apk"
      - name: Verify V4 Inside APK
        shell: bash
        run: |
          set -e

          APK="${GITHUB_WORKSPACE}/Pani-Puri-Business-V14.2-V4.apk"

          echo "Checking APK: $APK"

          mkdir -p apk_check
          unzip -q -o "$APK" "assets/index.html" -d apk_check

          test -f apk_check/assets/index.html || {
            echo "ERROR: index.html not found inside APK."
            exit 1
          }

          echo "Checking V4 markers inside APK..."

          grep -q 'expenseEntriesMain' apk_check/assets/index.html || {
            echo "ERROR: V4 marker expenseEntriesMain NOT found inside APK."
            exit 1
          }

          grep -q 'renderSharedExpenseViews' apk_check/assets/index.html || {
            echo "ERROR: V4 marker renderSharedExpenseViews NOT found inside APK."
            exit 1
          }

          if grep -q 'Recently Deleted Entries' apk_check/assets/index.html; then
            echo "ERROR: Old 'Recently Deleted Entries' UI still exists inside APK."
            exit 1
          fi

          if grep -q 'Entries — Delete' apk_check/assets/index.html; then
            echo "ERROR: Old 'Entries — Delete' UI still exists inside APK."
            exit 1
          fi

          echo "V4 APK verification PASSED."

      - name: Show APK SHA-1
        shell: bash
        run: |
          keytool -printcert \
            -jarfile "${GITHUB_WORKSPACE}/Pani-Puri-Business-V14.2-V4.apk" \
            | grep -E 'SHA1:|SHA-1:' || true

      - name: Show APK SHA-256
        shell: bash
        run: |
          keytool -printcert \
            -jarfile "${GITHUB_WORKSPACE}/Pani-Puri-Business-V14.2-V4.apk" \
            | grep -E 'SHA256:|SHA-256:' || true

      - name: Upload V4 APK
        uses: actions/upload-artifact@v4
        with:
          name: Pani-Puri-Business-V14.2-V4-APK
          path: Pani-Puri-Business-V14.2-V4.apk
          if-no-files-found: error

      - name: Build Complete
        run: echo "Pani Puri Business V14.2 V4 APK तयार आहे."
