name: Build Android APK V14.2 - ADMIN OTHER FIX

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Pani Puri Business V14.2
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. CHECKOUT
      # =====================================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # =====================================================
      # 2. JAVA 17
      # =====================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # =====================================================
      # 3. GRADLE 8.7
      # =====================================================
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'


      # =====================================================
      # 4. FIND V14.2 SOURCE ZIP
      # =====================================================
      - name: Find V14.2 Source ZIP
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SEARCHING FOR V14.2 SOURCE ZIP"
          echo "=========================================="

          ZIP="Pani_Puri_Business_V14_2_ADMIN_OTHER_FIX.zip"

          echo "Looking for:"
          echo "$ZIP"

          if [ ! -f "$ZIP" ]; then
            echo ""
            echo "ERROR: $ZIP not found."
            echo ""
            echo "Files available in repository:"
            find . -maxdepth 3 -type f | sort
            echo ""
            echo "Please upload the ZIP to the repository ROOT."
            exit 1
          fi

          echo ""
          echo "SUCCESS: V14.2 source ZIP found."
          ls -lh "$ZIP"


      # =====================================================
      # 5. EXTRACT SOURCE
      # =====================================================
      - name: Extract V14.2 Source
        shell: bash
        run: |
          set -e

          rm -rf v142_source
          mkdir -p v142_source

          unzip -q \
            "Pani_Puri_Business_V14_2_ADMIN_OTHER_FIX.zip" \
            -d v142_source

          echo "=========================================="
          echo "EXTRACTED SOURCE"
          echo "=========================================="

          find v142_source -maxdepth 4 -type f | sort


      # =====================================================
      # 6. DETECT ANDROID PROJECT
      # =====================================================
      - name: Detect Android Project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/v142_source" \
            -name settings.gradle \
            -o -name settings.gradle.kts \
            | head -n 1 \
            | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."
            exit 1
          fi

          echo "ANDROID PROJECT:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # =====================================================
      # 7. VERIFY SOURCE
      # =====================================================
      - name: Verify Corrected Source
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VERIFYING V14.2 SOURCE"
          echo "=========================================="

          MAIN="$PROJECT_DIR/app/src/main/java/com/panipuri/business/MainActivity.java"
          HTML="$PROJECT_DIR/app/src/main/assets/index.html"

          if [ ! -f "$MAIN" ]; then
            echo "ERROR: MainActivity.java not found."
            exit 1
          fi

          if [ ! -f "$HTML" ]; then
            echo "ERROR: index.html not found."
            exit 1
          fi

          echo "MainActivity.java FOUND"
          echo "index.html FOUND"

          echo ""
          echo "Checking Admin:"
          grep -n -i "admin" "$HTML" | head -20 || true

          echo ""
          echo "Checking Other Amount:"
          grep -n -i "other" "$HTML" | head -30 || true

          echo ""
          echo "Checking Cash/Credit:"
          grep -n -i "cash\|credit" "$HTML" | head -30 || true


      # =====================================================
      # 8. ENABLE ANDROIDX
      # =====================================================
      - name: Enable AndroidX
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          mkdir -p "$HOME/.gradle"

          cat > "$HOME/.gradle/gradle.properties" <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

      # =====================================================
      # 9. CLEAN PROJECT
      # =====================================================
      - name: Clean Project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "CLEANING ANDROID PROJECT"
          echo "=========================================="

          gradle --version

          gradle \
            --no-daemon \
            clean


      # =====================================================
      # 10. BUILD APK
      # =====================================================
      - name: Build V14.2 Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "BUILDING PANI PURI BUSINESS V14.2"
          echo "=========================================="

          gradle \
            --no-daemon \
            assembleDebug


      # =====================================================
      # 11. FIND APK
      # =====================================================
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SEARCHING FOR APK"
          echo "=========================================="

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*debug*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Debug APK not found."
            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"

          echo ""
          echo "APK FOUND:"
          echo "$APK"


      # =====================================================
      # 12. SHOW SHA-1
      # =====================================================
      - name: Show Debug APK SHA-1
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "APK CERTIFICATE SHA-1"
          echo "=========================================="

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner \
            | sort \
            | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found."
            exit 1
          fi

          "$APKSIGNER" \
            verify \
            --print-certs \
            "$APK"


      # =====================================================
      # 13. COPY APK
      # =====================================================
      - name: Copy APK
        shell: bash
        run: |
          set -e

          cp "$APK" \
            "$GITHUB_WORKSPACE/Pani-Puri-Business-V14.2-ADMIN-OTHER-FIX.apk"

          echo "APK copied successfully."

          ls -lh \
            "$GITHUB_WORKSPACE/Pani-Puri-Business-V14.2-ADMIN-OTHER-FIX.apk"


      # =====================================================
      # 14. UPLOAD APK ARTIFACT
      # =====================================================
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pani-Puri-Business-V14.2-ADMIN-OTHER-FIX
          path: Pani-Puri-Business-V14.2-ADMIN-OTHER-FIX.apk
          if-no-files-found: error


      # =====================================================
      # 15. BUILD SUCCESS
      # =====================================================
      - name: Build Success
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "V14.2 BUILD SUCCESS"
          echo "=========================================="
          echo ""
          echo "Admin fix included"
          echo "Other Amount Cash/Credit removed"
          echo "Cash/Credit available in Current Bill"
          echo "APK artifact uploaded successfully"
          echo ""
      
