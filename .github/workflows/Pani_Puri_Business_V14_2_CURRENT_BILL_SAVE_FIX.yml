name: Build Pani Puri Business V14.2 Fixed APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build V14.2 Fixed APK
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout Repository
        uses: actions/checkout@v6


      # =========================================================
      # 2. JAVA 17
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'


      # =========================================================
      # 3. SETUP GRADLE
      # =========================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'


      # =========================================================
      # 4. SHOW FILES
      # =========================================================
      - name: Show Repository Files
        shell: bash
        run: |
          echo "=========================================="
          echo "REPOSITORY CONTENT"
          echo "=========================================="
          find . -maxdepth 3 -type f | sort | head -300


            # =========================================================
      # 5. FIND AND EXTRACT EXACT V14.2 SOURCE ZIP
      # =========================================================
      - name: Find V14.2 Source ZIP
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SEARCHING FOR EXACT V14.2 V3 SOURCE ZIP"
          echo "=========================================="

          ZIP=$(find . -type f \
            -name "Pani-Puri-Business-V14.2-FINAL-ONLY-2-FIXES-V3.zip" \
            | head -1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Exact V3 source ZIP not found."
            echo ""
            echo "Available ZIP files:"
            find . -type f -iname "*.zip" -print
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "USING EXACT SOURCE ZIP"
          echo "=========================================="
          echo "$ZIP"

          rm -rf android-project
          mkdir -p android-project

          unzip -q "$ZIP" -d android-project

          echo ""
          echo "=========================================="
          echo "EXTRACTED SOURCE"
          echo "=========================================="

          find android-project -maxdepth 5 -type f | sort | head -500


      # =========================================================
      # 6. FIND GRADLE PROJECT
      # =========================================================
      - name: Detect Android Project
        shell: bash
        run: |
          set -e

          echo "Searching for settings.gradle..."

          SETTINGS=$(find android-project \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found."
            find android-project -maxdepth 6 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Detected project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # =========================================================
      # 7. CHECK GRADLE FILES
      # =========================================================
      - name: Verify Gradle Project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "GRADLE PROJECT"
          echo "=========================================="

          pwd

          ls -la

          echo ""
          echo "Gradle files:"
          find . -maxdepth 3 \
            \( -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "gradlew" \) \
            -print


      # =========================================================
      # 8. MAKE GRADLEW EXECUTABLE IF PRESENT
      # =========================================================
      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "gradlew found."
          else
            echo "gradlew not found."
            echo "System Gradle 8.7 will be used."
          fi


      # =========================================================
      # 9. CLEAN BUILD
      # =========================================================
      - name: Clean Project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            ./gradlew --no-daemon clean
          else
            gradle --no-daemon clean
          fi


      # =========================================================
      # 10. BUILD DEBUG APK
      # =========================================================
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "BUILDING V14.2 FIXED APK"
          echo "=========================================="

          if [ -f "./gradlew" ]; then
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi


      # =========================================================
      # 11. FIND APK
      # =========================================================
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SEARCHING FOR APK"
          echo "=========================================="

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*-debug.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            APK=$(find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              | head -1)
          fi

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp "$APK" \
            "$GITHUB_WORKSPACE/output/Pani-Puri-Business-V14.2-FIXED.apk"


      # =========================================================
      # 12. SHOW APK INFORMATION
      # =========================================================
      - name: APK Information
        shell: bash
        run: |
          echo "=========================================="
          echo "FINAL APK"
          echo "=========================================="

          ls -lh output/

          file output/Pani-Puri-Business-V14.2-FIXED.apk


      # =========================================================
      # 13. UPLOAD APK ARTIFACT
      # =========================================================
      - name: Upload V14.2 Fixed APK
        uses: actions/upload-artifact@v4
        with:
          name: Pani-Puri-Business-V14.2-FIXED-APK
          path: output/Pani-Puri-Business-V14.2-FIXED.apk
          if-no-files-found: error
