name: Build Pani Puri Business V14.2 Admin Dashboard Fixed APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build V14.2 Admin Dashboard Fixed APK
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout Repository
        uses: actions/checkout@v6


      # =========================================================
      # 2. JAVA 17
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'


      # =========================================================
      # 3. SETUP GRADLE 8.7
      # =========================================================
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'


      # =========================================================
      # 4. SHOW REPOSITORY FILES
      # =========================================================
      - name: Show Repository Files
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "REPOSITORY CONTENT"
          echo "=========================================="

          find . -maxdepth 4 -type f | sort | head -500


      # =========================================================
      # 5. FIND EXACT ADMIN DASHBOARD FIX SOURCE ZIP
      # =========================================================
      - name: Find Admin Dashboard Fix Source ZIP
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SEARCHING FOR ADMIN DASHBOARD FIX ZIP"
          echo "=========================================="

          ZIP=$(find . -type f \
            -name "Pani_Puri_Business_V14_2_ADMIN_DASHBOARD_FIX_5.zip" \
            | head -1)

          if [ -z "$ZIP" ]; then

            echo ""
            echo "ERROR: Required source ZIP not found."
            echo ""
            echo "Expected ZIP:"
            echo "Pani_Puri_Business_V14_2_ADMIN_DASHBOARD_FIX_5.zip"
            echo ""
            echo "Available ZIP files:"
            find . -type f -iname "*.zip" -print

            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "USING SOURCE ZIP"
          echo "=========================================="

          echo "$ZIP"

          rm -rf android-project
          mkdir -p android-project

          unzip -q "$ZIP" -d android-project

          echo ""
          echo "=========================================="
          echo "SOURCE EXTRACTED"
          echo "=========================================="

          find android-project -maxdepth 6 -type f | sort | head -600


      # =========================================================
      # 6. DETECT ANDROID PROJECT
      # =========================================================
      - name: Detect Android Project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SEARCHING FOR GRADLE PROJECT"
          echo "=========================================="

          SETTINGS=$(find android-project \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then

            echo ""
            echo "ERROR: settings.gradle not found."

            echo ""
            echo "Extracted files:"
            find android-project -maxdepth 8 -type f | sort

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo ""
          echo "=========================================="
          echo "ANDROID PROJECT DETECTED"
          echo "=========================================="

          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # =========================================================
      # 7. VERIFY PROJECT
      # =========================================================
      - name: Verify Android Project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "PROJECT STRUCTURE"
          echo "=========================================="

          pwd

          ls -la

          echo ""
          echo "Gradle files:"

          find . -maxdepth 4 \
            \( -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "gradlew" \) \
            -print


      # =========================================================
      # 8. VERIFY IMPORTANT V14.2 FEATURES
      # =========================================================
      - name: Verify V14.2 Fixed Features
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "VERIFYING V14.2 FEATURES"
          echo "=========================================="

          HTML="app/src/main/assets/index.html"
          JAVA="app/src/main/java/com/panipuri/business/MainActivity.java"
          GRADLE_FILE="app/build.gradle"

          if [ -f "$HTML" ]; then
            echo "index.html found."
          else
            echo "WARNING: index.html not found at expected path."
          fi

          if [ -f "$JAVA" ]; then
            echo "MainActivity.java found."
          else
            echo "WARNING: MainActivity.java not found at expected path."
          fi

          if [ -f "$GRADLE_FILE" ]; then
            echo "app/build.gradle found."
          else
            echo "WARNING: app/build.gradle not found at expected path."
          fi

          echo ""
          echo "Feature verification completed."


      # =========================================================
      # 9. PREPARE GRADLE
      # =========================================================
      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then

            chmod +x ./gradlew

            echo "gradlew found."
            echo "Using project Gradle wrapper."

          else

            echo "gradlew not found."
            echo "Using system Gradle 8.7."

          fi


      # =========================================================
      # 10. CLEAN BUILD
      # =========================================================
      - name: Clean Project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "CLEANING PROJECT"
          echo "=========================================="

          if [ -f "./gradlew" ]; then

            ./gradlew --no-daemon clean

          else

            gradle --no-daemon clean

          fi


      # =========================================================
      # 11. BUILD DEBUG APK
      # =========================================================
      - name: Build V14.2 Fixed APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "BUILDING V14.2 FIXED APK"
          echo "=========================================="

          if [ -f "./gradlew" ]; then

            ./gradlew --no-daemon assembleDebug --stacktrace

          else

            gradle --no-daemon assembleDebug --stacktrace

          fi


      # =========================================================
      # 12. FIND APK
      # =========================================================
      - name: Find Built APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SEARCHING FOR BUILT APK"
          echo "=========================================="

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*-debug.apk" \
            | head -1)

          if [ -z "$APK" ]; then

            APK=$(find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              | head -1)

          fi

          if [ -z "$APK" ]; then

            echo ""
            echo "ERROR: APK was not generated."
            exit 1

          fi

          echo ""
          echo "=========================================="
          echo "APK FOUND"
          echo "=========================================="

          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp "$APK" \
            "$GITHUB_WORKSPACE/output/Pani-Puri-Business-V14.2-ADMIN-DASHBOARD-FIXED.apk"


      # =========================================================
      # 13. APK INFORMATION
      # =========================================================
      - name: Show APK Information
        shell: bash
        run: |
          echo "=========================================="
          echo "FINAL APK"
          echo "=========================================="

          ls -lh output/

          file output/Pani-Puri-Business-V14.2-ADMIN-DASHBOARD-FIXED.apk


      # =========================================================
      # 14. UPLOAD APK ARTIFACT
      # =========================================================
      - name: Upload V14.2 Fixed APK
        uses: actions/upload-artifact@v4
        with:
          name: Pani-Puri-Business-V14.2-ADMIN-DASHBOARD-FIXED-APK
          path: output/Pani-Puri-Business-V14.2-ADMIN-DASHBOARD-FIXED.apk
          if-no-files-found: error
