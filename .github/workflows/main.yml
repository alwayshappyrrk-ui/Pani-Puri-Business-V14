name: Build Pani Puri Business V14.1 Feature Update

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK V14.1
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout Repository
        uses: actions/checkout@v6


      # =========================================================
      # 2. JAVA 17
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'


      # =========================================================
      # 3. GRADLE 8.7
      # =========================================================
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'


      # =========================================================
      # 4. EXTRACT V14.1 SOURCE ZIP
      # =========================================================
      - name: Extract V14.1 Feature Update Source
        shell: bash
        run: |
          set -e

          rm -rf android-project
          mkdir -p android-project

          ZIP="$(find . -maxdepth 2 -type f -name 'Pani_Puri_Business_V14_1_FEATURE_UPDATE.zip' -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: Pani_Puri_Business_V14_1_FEATURE_UPDATE.zip not found."
            exit 1
          fi

          echo "Using source ZIP: $ZIP"

          unzip -q "$ZIP" -d android-project

          PROJECT_DIR="$(find android-project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "======================================"
          echo "PROJECT DIRECTORY"
          echo "======================================"
          echo "$PROJECT_DIR"


      # =========================================================
      # 5. VERIFY V14.1 FEATURES
      # =========================================================
      - name: Verify Feature Source
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Checking V14.1 features..."

          grep -q "Other Amount" app/src/main/assets/index.html

          grep -q "openCreditView" app/src/main/assets/index.html

          grep -q "Quick Expense" app/src/main/assets/index.html

          grep -q "PPHandleBack" app/src/main/assets/index.html

          grep -q "Payment Mode" app/src/main/java/com/panipuri/business/MainActivity.java

          grep -q "Sheet credit" app/src/main/java/com/panipuri/business/MainActivity.java

          grep -q "Sheet expenses" app/src/main/java/com/panipuri/business/MainActivity.java

          echo "======================================"
          echo "V14.1 FEATURE CHECKS PASSED"
          echo "======================================"


      # =========================================================
      # 6. CONFIGURE ANDROIDX
      # =========================================================
      - name: Configure AndroidX
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          touch gradle.properties

          grep -qxF 'android.useAndroidX=true' gradle.properties \
            || echo 'android.useAndroidX=true' >> gradle.properties

          grep -qxF 'android.enableJetifier=true' gradle.properties \
            || echo 'android.enableJetifier=true' >> gradle.properties


      # =========================================================
      # 7. SHOW PROJECT STRUCTURE
      # =========================================================
      - name: Show Project Structure
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "======================================"
          echo "settings.gradle"
          echo "======================================"

          cat settings.gradle

          echo "======================================"
          echo "app/build.gradle"
          echo "======================================"

          cat app/build.gradle


      # =========================================================
      # 8. BUILD APK
      # =========================================================
      - name: Build V14.1 Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "BUILDING PANI PURI BUSINESS V14.1"
          echo "======================================"

          gradle --no-daemon clean assembleDebug --stacktrace


      # =========================================================
      # 9. FIND APK
      # =========================================================
      - name: Locate APK
        id: locate
        shell: bash
        run: |
          set -e

          APK="$(find "${{ env.PROJECT_DIR }}" \
            -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: Debug APK not found."
            exit 1
          fi

          cp "$APK" Pani-Puri-Business-V14.1.apk

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

          echo "======================================"
          echo "APK FOUND"
          echo "======================================"
          echo "$APK"


      # =========================================================
      # 10. SHOW ACTUAL APK SHA-1
      # =========================================================
      - name: Show APK Certificate SHA-1
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "ACTUAL APK CERTIFICATE SHA-1"
          echo "======================================"

          keytool -printcert \
            -jarfile "Pani-Puri-Business-V14.1.apk" \
            | grep -E 'SHA1:|SHA-1:'


      # =========================================================
      # 11. UPLOAD APK
      # =========================================================
      - name: Upload V14.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: Pani-Puri-Business-V14.1-APK
          path: Pani-Puri-Business-V14.1.apk
          if-no-files-found: error


      # =========================================================
      # 12. BUILD COMPLETE
      # =========================================================
      - name: Build Complete
        run: |
          echo "======================================"
          echo "PANI PURI BUSINESS V14.1"
          echo "BUILD COMPLETED SUCCESSFULLY"
          echo "======================================"
