name: Build Pani Puri Business V14.2

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK V14.2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find V14.2 Source ZIP
        id: findzip
        shell: bash
        run: |
          set -e

          ZIP="$(find . -maxdepth 3 -type f \
            -name 'Pani_Puri_Business_V14_2_FULLSCREEN_AD.zip' \
            -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: Pani_Puri_Business_V14_2_FULLSCREEN_AD.zip not found."
            echo "Upload the V14.2 ZIP to the repository root."
            exit 1
          fi

          echo "ZIP=$ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract V14.2 Source
        shell: bash
        run: |
          set -e

          rm -rf v142_source
          mkdir -p v142_source

          unzip -q "${{ steps.findzip.outputs.zip }}" -d v142_source

          PROJECT_DIR="$(find v142_source \
            -type f \
            -name settings.gradle \
            -printf '%h\n' | head -1)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle not found after extraction."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify V14.2 Features
        shell: bash
        run: |
          set -e

          HTML="$PROJECT_DIR/app/src/main/assets/index.html"
          JAVA="$PROJECT_DIR/app/src/main/java/com/panipuri/business/MainActivity.java"
          GRADLE="$PROJECT_DIR/app/build.gradle"

          test -f "$HTML"
          test -f "$JAVA"
          test -f "$GRADLE"

          grep -q 'Full-Screen Advertisement' "$HTML"
          grep -q 'openOtherAmount' "$HTML"
          grep -q 'openExpensePad' "$HTML"
          grep -q "savePayment('Credit')" "$HTML"
          grep -q 'renderCreditList' "$HTML"
          grep -q 'markCustomerPaid' "$HTML"
          grep -q 'PPHandleBack' "$HTML"

          grep -q 'AndroidMedia' "$JAVA"
          grep -q 'InternalStoragePathHandler' "$JAVA"
          grep -q 'REQ_AD_MEDIA' "$JAVA"

          grep -q 'F4:96:33:10:EE:A1:3D:7D:0C:64:1E:07:48:3E:C0:A4:C2:C1:C4:23' "$JAVA"

          grep -q "versionCode 142" "$GRADLE"
          grep -q "versionName '14.2'" "$GRADLE"

          echo "========================================"
          echo "V14.2 SOURCE VERIFICATION PASSED"
          echo "========================================"

      - name: Show Project Information
        shell: bash
        run: |
          echo "Project: $PROJECT_DIR"

          grep -nE \
            'applicationId|versionCode|versionName' \
            "$PROJECT_DIR/app/build.gradle"

          grep -n 'drive.file' \
            "$PROJECT_DIR/app/src/main/java/com/panipuri/business/MainActivity.java"

      - name: Build V14.2 Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -x ./gradlew ]; then
            ./gradlew --no-daemon clean assembleDebug
          else
            gradle --no-daemon clean assembleDebug
          fi

      - name: Locate V14.2 APK
        shell: bash
        run: |
          set -e

          APK="$(find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: Debug APK not found."
            exit 1
          fi

          cp "$APK" \
            "$GITHUB_WORKSPACE/Pani-Puri-Business-V14.2-FULLSCREEN-AD.apk"

          echo "APK=$APK"

          ls -lh \
            "$GITHUB_WORKSPACE/Pani-Puri-Business-V14.2-FULLSCREEN-AD.apk"

      - name: Show Actual APK Certificate SHA-1
        shell: bash
        run: |
          set -e

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name apksigner \
            | sort -V \
            | tail -1)"

          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found"
            exit 1
          fi

          "$APKSIGNER" verify \
            --print-certs \
            "$GITHUB_WORKSPACE/Pani-Puri-Business-V14.2-FULLSCREEN-AD.apk" \
            | tee apk-cert.txt

      - name: Show APK Details
        shell: bash
        run: |
          ls -lh \
            "$GITHUB_WORKSPACE/Pani-Puri-Business-V14.2-FULLSCREEN-AD.apk"

          file \
            "$GITHUB_WORKSPACE/Pani-Puri-Business-V14.2-FULLSCREEN-AD.apk"

      - name: Upload V14.2 APK
        uses: actions/upload-artifact@v4
        with:
          name: Pani-Puri-Business-V14.2-FULLSCREEN-AD-APK
          path: Pani-Puri-Business-V14.2-FULLSCREEN-AD.apk
          if-no-files-found: error

      - name: Build Complete
        run: |
          echo "========================================"
          echo "PANI PURI BUSINESS V14.2"
          echo "BUILD COMPLETED SUCCESSFULLY"
          echo "========================================"
