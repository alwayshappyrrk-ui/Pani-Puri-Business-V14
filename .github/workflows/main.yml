name: Build Pani Puri Business V14 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout V14 Repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.7'

      - name: Detect Android Project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Checking V14 Android project..."
          echo "======================================"

          echo "Repository contents:"
          find . -maxdepth 3 -type f | sort | head -300

          # Case 1: Android project already at repository root
          if [ -f "./settings.gradle" ] && [ -f "./app/build.gradle" ]; then
            echo "Android project found at repository root."
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
            exit 0
          fi

          # Case 2: Android project is inside a folder
          PROJECT_DIR=$(find . -type f -name "settings.gradle" -print -quit | xargs -r dirname)

          if [ -n "$PROJECT_DIR" ] && [ -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "Android project found in:"
            echo "$PROJECT_DIR"
            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
            exit 0
          fi

          # Case 3: V14 ZIP exists in repository
          ZIP=$(find . -type f -iname "*.zip" -print | head -n 1)

          if [ -n "$ZIP" ]; then
            echo "ZIP found:"
            echo "$ZIP"

            rm -rf android-project
            mkdir -p android-project

            unzip -q "$ZIP" -d android-project

            PROJECT_DIR=$(find android-project -type f -name "settings.gradle" -print -quit | xargs -r dirname)

            if [ -n "$PROJECT_DIR" ] && [ -f "$PROJECT_DIR/app/build.gradle" ]; then
              echo "Android project extracted to:"
              echo "$PROJECT_DIR"
              echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
              exit 0
            fi
          fi

          echo ""
          echo "ERROR: Android project could not be found."
          echo "settings.gradle and app/build.gradle are required."
          exit 1

      - name: Show Project Structure
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "======================================"
          echo "V14 PROJECT:"
          echo "$PWD"
          echo "======================================"

          echo ""
          echo "Project files:"
          find . -maxdepth 3 -type f | sort

      - name: Configure AndroidX
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          touch gradle.properties

          grep -qxF "android.useAndroidX=true" gradle.properties || \
          echo "android.useAndroidX=true" >> gradle.properties

          grep -qxF "android.enableJetifier=true" gradle.properties || \
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Check Gradle Project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "======================================"
          echo "Checking Gradle project..."
          echo "======================================"

          echo "settings.gradle:"
          cat settings.gradle

          echo ""
          echo "build.gradle:"
          cat build.gradle

          echo ""
          echo "app/build.gradle:"
          cat app/build.gradle

      - name: Build V14 Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "BUILDING PANI PURI BUSINESS V14"
          echo "======================================"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug \
              --no-daemon \
              --stacktrace
          else
            echo "Gradle Wrapper not found."
            echo "Using installed Gradle 8.7..."
            gradle assembleDebug \
              --no-daemon \
              --stacktrace
          fi

      - name: Find APK
        id: apk
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "SEARCHING FOR APK"
          echo "======================================"

          APK=$(find "${{ env.PROJECT_DIR }}" \
            -type f \
            -name "*.apk" \
            -print \
            | head -n 1)

          if [
