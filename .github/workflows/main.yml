name: Build Pani Puri Business V14 OAuth FIX V2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK - OAuth FIX V2
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout Repository
        uses: actions/checkout@v6


      # =========================================================
      # 2. JAVA 17
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'


      # =========================================================
      # 3. SETUP GRADLE 8.7
      # =========================================================
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'


      # =========================================================
      # 4. USE ONLY OAUTH FIX V2 ZIP
      # =========================================================
      - name: Extract OAuth FIX V2 Source
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "PANI PURI BUSINESS V14"
          echo "OAUTH FIX V2"
          echo "======================================"

          ZIP_NAME="Pani_Puri_Business_V14_OAUTH_FIX_V2.zip"

          if [ ! -f "$ZIP_NAME" ]; then
            echo "ERROR: Required ZIP not found:"
            echo "$ZIP_NAME"
            echo ""
            echo "ZIP files in repository:"
            find . -maxdepth 2 -type f -name "*.zip" -print
            exit 1
          fi

          rm -rf android-project
          mkdir -p android-project

          echo "Using EXACT ZIP:"
          echo "$ZIP_NAME"

          unzip -q "$ZIP_NAME" -d android-project

          echo ""
          echo "ZIP extracted."

          FOUND=$(find android-project -type f -name "settings.gradle" | head -n 1 || true)

          if [ -z "$FOUND" ]; then
            echo "ERROR: settings.gradle not found inside V2 ZIP"
            find android-project -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$FOUND")

          echo ""
          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # =========================================================
      # 5. VERIFY V2 SOURCE
      # =========================================================
      - name: Verify OAuth FIX V2 Source
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "VERIFYING OAUTH FIX V2 SOURCE"
          echo "======================================"

          JAVA_FILE="app/src/main/java/com/panipuri/business/MainActivity.java"

          if [ ! -f "$JAVA_FILE" ]; then
            echo "ERROR: MainActivity.java not found"
            exit 1
          fi

          echo "MainActivity found."

          if grep -q "Google OAuth did not return an access token" "$JAVA_FILE"; then
            echo "OK: OAuth FIX V2 code detected."
          else
            echo "ERROR: OAuth FIX V2 code NOT detected."
            echo "Wrong/old source ZIP may have been uploaded."
            exit 1
          fi

          echo ""
          echo "Drive scope references:"
          grep -n "drive.file" "$JAVA_FILE" || true


      # =========================================================
      # 6. ENABLE ANDROIDX
      # =========================================================
      - name: Configure AndroidX
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if [ ! -f "gradle.properties" ]; then
            touch gradle.properties
          fi

          grep -q "android.useAndroidX=true" gradle.properties || \
            echo "android.useAndroidX=true" >> gradle.properties

          grep -q "android.enableJetifier=true" gradle.properties || \
            echo "android.enableJetifier=true" >> gradle.properties

          echo ""
          echo "gradle.properties:"
          cat gradle.properties


      # =========================================================
      # 7. SHOW PROJECT
      # =========================================================
      - name: Show Project Structure
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "======================================"
          echo "PROJECT STRUCTURE"
          echo "======================================"

          echo "PROJECT_DIR=$PROJECT_DIR"

          echo ""
          echo "settings.gradle:"
          cat settings.gradle

          echo ""
          echo "app/build.gradle:"
          cat app/build.gradle


      # =========================================================
      # 8. BUILD APK
      # =========================================================
      - name: Build V14 OAuth FIX V2 Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "BUILDING V14 OAUTH FIX V2 APK"
          echo "======================================"

          gradle --no-daemon clean assembleDebug

          echo ""
          echo "BUILD COMPLETED SUCCESSFULLY."


      # =========================================================
      # 9. FIND APK
      # =========================================================
      - name: Find APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          APK=$(find . -type f -path "*/build/outputs/apk/debug/*.apk" | head -n 1 || true)

          if [ -z "$APK" ]; then
            echo "ERROR: APK NOT FOUND"
            echo ""
            find . -type f -name "*.apk" || true
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          cp "$APK" \
            "${GITHUB_WORKSPACE}/Pani-Puri-Business-V14-OAUTH-FIX-V2.apk"


      # =========================================================
      # 10. VERIFY APK
      # =========================================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="${GITHUB_WORKSPACE}/Pani-Puri-Business-V14-OAUTH-FIX-V2.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK does not exist"
            exit 1
          fi

          echo "======================================"
          echo "APK VERIFIED"
          echo "======================================"

          ls -lh "$APK"

          echo ""
          echo "Expected Package:"
          echo "com.panipuri.business"

          echo ""
          echo "Expected Version:"
          echo "14.0"


      # =========================================================
      # 11. SHOW ANDROID DEBUG SHA-1
      # =========================================================
      - name: Show Android Debug SHA-1
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "ANDROID DEBUG KEY SHA-1"
          echo "======================================"

          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          keytool -list \
            -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            | grep -E "SHA1:|SHA-1:"


      # =========================================================
      # 12. SHOW ACTUAL APK CERTIFICATE SHA-1
      # =========================================================
      - name: Show APK Certificate SHA-1
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "ACTUAL APK CERTIFICATE SHA-1"
          echo "======================================"

          keytool -printcert \
            -jarfile "${GITHUB_WORKSPACE}/Pani-Puri-Business-V14-OAUTH-FIX-V2.apk" \
            | grep -E "SHA1:|SHA-1:"


      # =========================================================
      # 13. UPLOAD APK
      # =========================================================
      - name: Upload V14 OAuth FIX V2 APK
        uses: actions/upload-artifact@v6
        with:
          name: Pani-Puri-Business-V14-OAUTH-FIX-V2
          path: Pani-Puri-Business-V14-OAUTH-FIX-V2.apk
          if-no-files-found: error


      # =========================================================
      # 14. BUILD COMPLETE
      # =========================================================
      - name: Build Complete
        shell: bash
        run: |
          echo "======================================"
          echo "BUILD SUCCESSFUL"
          echo "======================================"

          echo ""
          echo "Pani Puri Business V14 OAuth FIX V2 APK तयार आहे."

          echo ""
          echo "Package:"
          echo "com.panipuri.business"

          echo ""
          echo "Version:"
          echo "14.0"

          echo ""
          echo "APK:"
          echo "Pani-Puri-Business-V14-OAUTH-FIX-V2.apk"
