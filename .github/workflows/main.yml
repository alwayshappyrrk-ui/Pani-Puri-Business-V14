name: Build Pani Puri Business V14.2 FEATURE FIX FINAL

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK V14.2 FINAL
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout Repository
        uses: actions/checkout@v6


      # =========================================================
      # 2. JAVA 17
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'


      # =========================================================
      # 3. GRADLE 8.7
      # =========================================================
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'


      # =========================================================
      # 4. FIND V14.2 FINAL ZIP
      # =========================================================
      - name: Find V14.2 Feature Fix ZIP
        id: findzip
        shell: bash
        run: |
          set -e

          echo "Searching for V14.2 Feature Fix ZIP..."

          ZIP="$(find . -maxdepth 4 -type f \
            -name 'Pani_Puri_Business_V14_2_FEATURE_FIX_FINAL.zip' \
            -print -quit)"

          if [ -z "$ZIP" ]; then
            echo ""
            echo "=============================================="
            echo "ERROR: ZIP NOT FOUND"
            echo "=============================================="
            echo ""
            echo "Required file:"
            echo "Pani_Puri_Business_V14_2_FEATURE_FIX_FINAL.zip"
            echo ""
            echo "Files found in repository:"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP"

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"


      # =========================================================
      # 5. EXTRACT ZIP
      # =========================================================
      - name: Extract V14.2 Feature Fix Source
        shell: bash
        run: |
          set -e

          rm -rf v142_source

          mkdir -p v142_source

          unzip -q \
            "${{ steps.findzip.outputs.zip }}" \
            -d v142_source

          echo ""
          echo "=============================================="
          echo "SOURCE EXTRACTED"
          echo "=============================================="

          find v142_source -maxdepth 5 -type f | head -150


      # =========================================================
      # 6. DETECT ANDROID PROJECT
      # =========================================================
      - name: Detect Android Project
        shell: bash
        run: |
          set -e

          PROJECT_DIR="$(find v142_source \
            -type f \
            -name settings.gradle \
            -printf '%h\n' | head -1)"

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="$(find v142_source \
              -type f \
              -name settings.gradle.kts \
              -printf '%h\n' | head -1)"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo ""
            echo "=============================================="
            echo "ERROR: ANDROID PROJECT NOT FOUND"
            echo "=============================================="
            exit 1
          fi

          echo "ANDROID PROJECT:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # =========================================================
      # 7. CHECK REQUIRED FILES
      # =========================================================
      - name: Check Required Android Files
        shell: bash
        run: |
          set -e

          echo "Checking Android project files..."

          if [ -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "settings.gradle OK"
          elif [ -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "settings.gradle.kts OK"
          else
            echo "ERROR: settings.gradle missing"
            exit 1
          fi

          if [ -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "app/build.gradle OK"
          elif [ -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "app/build.gradle.kts OK"
          else
            echo "ERROR: app Gradle file missing"
            exit 1
          fi

          test -f \
            "$PROJECT_DIR/app/src/main/assets/index.html"

          test -f \
            "$PROJECT_DIR/app/src/main/java/com/panipuri/business/MainActivity.java"

          echo ""
          echo "All required files found."


      # =========================================================
      # 8. SHOW VERSION
      # =========================================================
      - name: Show App Version
        shell: bash
        run: |
          echo ""
          echo "=============================================="
          echo "APP VERSION"
          echo "=============================================="

          grep -nE \
            'applicationId|versionCode|versionName' \
            "$PROJECT_DIR/app/build.gradle" \
            || true


      # =========================================================
      # 9. VERIFY OTHER AMOUNT
      # =========================================================
      - name: Verify Other Amount Feature
        shell: bash
        run: |
          set -e

          HTML="$PROJECT_DIR/app/src/main/assets/index.html"

          echo "Checking Other Amount..."

          grep -qi 'Other' "$HTML"
          grep -qi 'other' "$HTML"

          echo "Other Amount feature detected."


      # =========================================================
      # 10. VERIFY CREDIT
      # =========================================================
      - name: Verify Credit Feature
        shell: bash
        run: |
          set -e

          HTML="$PROJECT_DIR/app/src/main/assets/index.html"

          echo "Checking Credit..."

          grep -qi 'Credit' "$HTML"
          grep -qi 'credit' "$HTML"

          echo "Credit feature detected."


      # =========================================================
      # 11. VERIFY EXPENSE
      # =========================================================
      - name: Verify Expense Feature
        shell: bash
        run: |
          set -e

          HTML="$PROJECT_DIR/app/src/main/assets/index.html"

          echo "Checking Expenses..."

          grep -qi 'Expense' "$HTML"
          grep -qi 'expense' "$HTML"

          echo "Expense feature detected."


      # =========================================================
      # 12. VERIFY ADVERTISEMENT
      # =========================================================
      - name: Verify Advertisement Feature
        shell: bash
        run: |
          set -e

          HTML="$PROJECT_DIR/app/src/main/assets/index.html"

          echo "Checking Advertisement..."

          grep -qi 'Advertisement' "$HTML"
          grep -qi 'advertisement' "$HTML"

          echo "Checking image support..."
          grep -qi 'image' "$HTML"

          echo "Checking timer/slideshow support..."
          grep -qi 'timer' "$HTML"

          echo "Advertisement feature detected."


      # =========================================================
      # 13. VERIFY BACK NAVIGATION
      # =========================================================
      - name: Verify Back Navigation
        shell: bash
        run: |
          set -e

          HTML="$PROJECT_DIR/app/src/main/assets/index.html"

          echo "Checking Back Navigation..."

          grep -qi 'back' "$HTML"

          echo "Back navigation code detected."


      # =========================================================
      # 14. VERIFY GOOGLE DRIVE CODE
      # =========================================================
      - name: Verify Google Drive Integration
        shell: bash
        run: |
          set -e

          JAVA="$PROJECT_DIR/app/src/main/java/com/panipuri/business/MainActivity.java"

          echo "Checking Google Drive integration..."

          grep -q 'drive.file' "$JAVA"

          echo "Google Drive scope detected."

          echo ""
          echo "NOTE:"
          echo "Google Drive OAuth will be tested separately."
          echo "Current build is focused on app stability/features."


      # =========================================================
      # 15. GRADLE WRAPPER
      # =========================================================
      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Gradle wrapper found."
          else
            echo "Gradle wrapper not found."
            echo "System Gradle 8.7 will be used."
          fi


      # =========================================================
      # 16. CLEAN
      # =========================================================
      - name: Clean Android Build
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -x "./gradlew" ]; then
            ./gradlew --no-daemon clean
          else
            gradle --no-daemon clean
          fi


      # =========================================================
      # 17. BUILD APK
      # =========================================================
      - name: Build V14.2 Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo ""
          echo "=============================================="
          echo "BUILDING PANI PURI BUSINESS V14.2"
          echo "=============================================="

          if [ -x "./gradlew" ]; then
            ./gradlew \
              --no-daemon \
              --stacktrace \
              assembleDebug
          else
            gradle \
              --no-daemon \
              --stacktrace \
              assembleDebug
          fi


      # =========================================================
      # 18. FIND APK
      # =========================================================
      - name: Locate Generated APK
        shell: bash
        run: |
          set -e

          echo "Searching generated APK..."

          APK="$(find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo ""
            echo "=============================================="
            echo "ERROR: APK NOT FOUND"
            echo "=============================================="

            find "$PROJECT_DIR" \
              -type f \
              -name '*.apk' \
              -print

            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          cp "$APK" \
            "$GITHUB_WORKSPACE/Pani-Puri-Business-V14.2-FEATURE-FIX-FINAL.apk"


      # =========================================================
      # 19. APK DETAILS
      # =========================================================
      - name: Show APK Details
        shell: bash
        run: |
          set -e

          echo ""
          echo "=============================================="
          echo "APK DETAILS"
          echo "=============================================="

          ls -lh \
            "$GITHUB_WORKSPACE/Pani-Puri-Business-V14.2-FEATURE-FIX-FINAL.apk"

          file \
            "$GITHUB_WORKSPACE/Pani-Puri-Business-V14.2-FEATURE-FIX-FINAL.apk"


      # =========================================================
      # 20. SHOW APK SHA-1
      # =========================================================
      - name: Show Actual APK Certificate SHA-1
        shell: bash
        run: |
          set -e

          echo ""
          echo "=============================================="
          echo "APK CERTIFICATE SHA-1"
          echo "=============================================="

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name apksigner \
            | sort -V \
            | tail -1)"

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          "$APKSIGNER" verify \
            --print-certs \
            "$GITHUB_WORKSPACE/Pani-Puri-Business-V14.2-FEATURE-FIX-FINAL.apk"


      # =========================================================
      # 21. UPLOAD APK
      # =========================================================
      - name: Upload V14.2 APK
        uses: actions/upload-artifact@v4
        with:
          name: Pani-Puri-Business-V14.2-FEATURE-FIX-FINAL-APK
          path: Pani-Puri-Business-V14.2-FEATURE-FIX-FINAL.apk
          if-no-files-found: error


      # =========================================================
      # 22. SUCCESS
      # =========================================================
      - name: Build Complete
        shell: bash
        run: |
          echo ""
          echo "=============================================="
          echo "✅ PANI PURI BUSINESS V14.2"
          echo "✅ FEATURE FIX FINAL"
          echo "✅ BUILD COMPLETED"
          echo "=============================================="
