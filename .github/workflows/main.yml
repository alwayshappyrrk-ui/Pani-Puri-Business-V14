name: Build Pani Puri Business V14 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      PROJECT_DIR: .

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout Repository
        uses: actions/checkout@v6


      # =========================================================
      # 2. JAVA 17
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'


      # =========================================================
      # 3. SETUP GRADLE 8.7
      # =========================================================
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'


      # =========================================================
      # 4. FIND AND PREPARE ANDROID PROJECT
      # =========================================================
      - name: Detect Android Project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "SEARCHING FOR ANDROID PROJECT"
          echo "======================================"

          PROJECT=""

          # Check root
          if [ -f "settings.gradle" ] && [ -f "app/build.gradle" ]; then
            PROJECT="."
          fi

          # Check directories
          if [ -z "$PROJECT" ]; then
            for dir in */; do
              if [ -f "${dir}settings.gradle" ] && [ -f "${dir}app/build.gradle" ]; then
                PROJECT="${dir%/}"
                break
              fi
            done
          fi

          # Check ZIP files
          if [ -z "$PROJECT" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1 || true)

            if [ -n "$ZIP_FILE" ]; then
              echo "ZIP FOUND: $ZIP_FILE"

              mkdir -p android-project

              unzip -q "$ZIP_FILE" -d android-project

              echo "ZIP EXTRACTED"

              if [ -f "android-project/settings.gradle" ] && [ -f "android-project/app/build.gradle" ]; then
                PROJECT="android-project"
              else
                FOUND=$(find android-project -type f -name "settings.gradle" | head -n 1 || true)

                if [ -n "$FOUND" ]; then
                  PROJECT=$(dirname "$FOUND")
                fi
              fi
            fi
          fi

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Android project not found"
            echo ""
            echo "Repository files:"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "ANDROID PROJECT FOUND:"
          echo "$PROJECT"

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"


      # =========================================================
      # 5. SHOW PROJECT STRUCTURE
      # =========================================================
      - name: Show Project Structure
        shell: bash
        run: |
          echo "======================================"
          echo "PROJECT DIRECTORY"
          echo "======================================"

          echo "PROJECT_DIR = $PROJECT_DIR"

          echo ""
          echo "FILES:"
          find "$PROJECT_DIR" -maxdepth 4 -type f | sort


      # =========================================================
      # 6. ENABLE ANDROIDX
      # =========================================================
      - name: Configure AndroidX
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "CONFIGURING ANDROIDX"
          echo "======================================"

          if [ ! -f "gradle.properties" ]; then
            touch gradle.properties
          fi

          if ! grep -q "android.useAndroidX=true" gradle.properties; then
            echo "android.useAndroidX=true" >> gradle.properties
          fi

          if ! grep -q "android.enableJetifier=true" gradle.properties; then
            echo "android.enableJetifier=true" >> gradle.properties
          fi

          echo ""
          echo "gradle.properties:"
          cat gradle.properties


      # =========================================================
      # 7. CHECK GRADLE PROJECT
      # =========================================================
      - name: Check Gradle Project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "CHECKING GRADLE PROJECT"
          echo "======================================"

          echo ""
          echo "settings.gradle:"
          cat settings.gradle

          echo ""
          echo "app/build.gradle:"
          cat app/build.gradle

          echo ""
          echo "Gradle version:"
          gradle --version


      # =========================================================
      # 8. BUILD V14 DEBUG APK
      # =========================================================
      - name: Build V14 Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "BUILDING PANI PURI BUSINESS V14"
          echo "======================================"

          gradle --no-daemon clean assembleDebug

          echo ""
          echo "BUILD COMPLETED"


      # =========================================================
      # 9. FIND APK
      # =========================================================
      - name: Find APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "SEARCHING FOR APK"
          echo "======================================"

          APK=$(find . -type f -path "*/build/outputs/apk/debug/*.apk" | head -n 1 || true)

          if [ -z "$APK" ]; then
            echo "ERROR: APK NOT FOUND"
            echo ""
            echo "All APK files:"
            find . -type f -name "*.apk" || true
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          cp "$APK" "${GITHUB_WORKSPACE}/Pani-Puri-Business-V14.apk"

          echo ""
          echo "APK COPIED SUCCESSFULLY"


      # =========================================================
      # 10. RENAME / VERIFY APK
      # =========================================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "VERIFYING APK"
          echo "======================================"

          if [ ! -f "${GITHUB_WORKSPACE}/Pani-Puri-Business-V14.apk" ]; then
            echo "ERROR: APK FILE DOES NOT EXIST"
            exit 1
          fi

          ls -lh "${GITHUB_WORKSPACE}/Pani-Puri-Business-V14.apk"


      # =========================================================
      # 11. SHOW ANDROID DEBUG SHA-1
      # =========================================================
      - name: Show Android Debug SHA-1
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "======================================"
          echo "ANDROID DEBUG KEY SHA-1"
          echo "======================================"

          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          keytool -list \
            -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            | grep -E "SHA1:|SHA-1:"


      # =========================================================
      # 12. SHOW APK CERTIFICATE SHA-1
      # =========================================================
      - name: Show APK Certificate SHA-1
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "APK CERTIFICATE SHA-1"
          echo "======================================"

          if [ ! -f "${GITHUB_WORKSPACE}/Pani-Puri-Business-V14.apk" ]; then
            echo "ERROR: APK NOT FOUND"
            exit 1
          fi

          keytool -printcert \
            -jarfile "${GITHUB_WORKSPACE}/Pani-Puri-Business-V14.apk" \
            | grep -E "SHA1:|SHA-1:" || true


      # =========================================================
      # 13. SHOW APK DETAILS
      # =========================================================
      - name: Show APK Details
        shell: bash
        run: |
          echo "======================================"
          echo "APK DETAILS"
          echo "======================================"

          ls -lh "${GITHUB_WORKSPACE}/Pani-Puri-Business-V14.apk"

          echo ""
          echo "PACKAGE:"
          echo "com.panipuri.business"

          echo ""
          echo "VERSION:"
          echo "14.0"


      # =========================================================
      # 14. UPLOAD APK
      # =========================================================
      - name: Upload V14 APK
        uses: actions/upload-artifact@v6
        with:
          name: Pani-Puri-Business-V14-APK
          path: Pani-Puri-Business-V14.apk
          if-no-files-found: error


      # =========================================================
      # 15. BUILD COMPLETE
      # =========================================================
      - name: Build Complete
        shell: bash
        run: |
          echo "======================================"
          echo "BUILD SUCCESSFUL"
          echo "======================================"

          echo ""
          echo "Pani Puri Business V14 APK तयार आहे."

          echo ""
          echo "Package:"
          echo "com.panipuri.business"

          echo ""
          echo "Version:"
          echo "14.0"

          echo ""
          echo "APK:"
          echo "Pani-Puri-Business-V14.apk"
