name: Build Pani Puri Business V14.2 Full Screen Advertisement

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK V14.2
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout Repository
        uses: actions/checkout@v6


      # =========================================================
      # 2. JAVA 17
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'


      # =========================================================
      # 3. GRADLE 8.7
      # =========================================================
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'


      # =========================================================
      # 4. FIND V14.2 ZIP
      # =========================================================
      - name: Find V14.2 Source ZIP
        shell: bash
        run: |
          set -e

          ZIP="$(find . -maxdepth 2 -type f \
            -name 'Pani_Puri_Business_V14_2_FULLSCREEN_AD.zip' \
            -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: V14.2 source ZIP not found."
            echo ""
            echo "Expected file:"
            echo "Pani_Puri_Business_V14_2_FULLSCREEN_AD.zip"
            exit 1
          fi

          echo "SOURCE_ZIP=$ZIP" >> "$GITHUB_ENV"

          echo "======================================"
          echo "SOURCE ZIP"
          echo "======================================"
          echo "$ZIP"


      # =========================================================
      # 5. EXTRACT SOURCE
      # =========================================================
      - name: Extract V14.2 Source
        shell: bash
        run: |
          set -e

          rm -rf android-project
          mkdir -p android-project

          unzip -q "$SOURCE_ZIP" -d android-project

          PROJECT_DIR="$(find android-project -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "======================================"
          echo "ANDROID PROJECT"
          echo "======================================"
          echo "$PROJECT_DIR"


      # =========================================================
      # 6. VERIFY V14.2 SOURCE
      # =========================================================
      - name: Verify V14.2 Full Screen Advertisement Feature
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Checking V14.2 source..."

          if [ ! -f app/src/main/assets/index.html ]; then
            echo "ERROR: index.html not found."
            exit 1
          fi

          if [ ! -f app/src/main/java/com/panipuri/business/MainActivity.java ]; then
            echo "ERROR: MainActivity.java not found."
            exit 1
          fi

          grep -qi "Full-Screen Advertisement" \
            app/src/main/assets/index.html

          grep -qi "advertisement" \
            app/src/main/assets/index.html

          grep -qi "fullscreen" \
            app/src/main/assets/index.html

          echo "======================================"
          echo "V14.2 FEATURE CHECK PASSED"
          echo "======================================"


      # =========================================================
      # 7. CONFIGURE ANDROIDX
      # =========================================================
      - name: Configure AndroidX
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          touch gradle.properties

          grep -qxF 'android.useAndroidX=true' gradle.properties \
            || echo 'android.useAndroidX=true' >> gradle.properties

          grep -qxF 'android.enableJetifier=true' gradle.properties \
            || echo 'android.enableJetifier=true' >> gradle.properties


      # =========================================================
      # 8. SHOW PROJECT INFO
      # =========================================================
      - name: Show Project Information
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "======================================"
          echo "SETTINGS.GRADLE"
          echo "======================================"

          if [ -f settings.gradle ]; then
            cat settings.gradle
          elif [ -f settings.gradle.kts ]; then
            cat settings.gradle.kts
          fi

          echo ""
          echo "======================================"
          echo "APP BUILD GRADLE"
          echo "======================================"

          if [ -f app/build.gradle ]; then
            cat app/build.gradle
          elif [ -f app/build.gradle.kts ]; then
            cat app/build.gradle.kts
          fi


      # =========================================================
      # 9. BUILD APK
      # =========================================================
      - name: Build V14.2 Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "BUILDING PANI PURI BUSINESS V14.2"
          echo "======================================"

          gradle --no-daemon clean assembleDebug --stacktrace


      # =========================================================
      # 10. FIND APK
      # =========================================================
      - name: Locate V14.2 APK
        shell: bash
        run: |
          set -e

          APK="$(find "${{ env.PROJECT_DIR }}" \
            -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: Debug APK not found."
            exit 1
          fi

          cp "$APK" Pani-Puri-Business-V14.2-FULLSCREEN-AD.apk

          echo "======================================"
          echo "APK FOUND"
          echo "======================================"

          ls -lh Pani-Puri-Business-V14.2-FULLSCREEN-AD.apk


      # =========================================================
      # 11. SHOW ACTUAL APK SHA-1
      # =========================================================
      - name: Show Actual APK Certificate SHA-1
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "ACTUAL APK CERTIFICATE SHA-1"
          echo "======================================"

          keytool -printcert \
            -jarfile "Pani-Puri-Business-V14.2-FULLSCREEN-AD.apk" \
            | grep -E 'SHA1:|SHA-1:'


      # =========================================================
      # 12. SHOW APK DETAILS
      # =========================================================
      - name: Show APK Details
        shell: bash
        run: |
          echo "======================================"
          echo "APK DETAILS"
          echo "======================================"

          file Pani-Puri-Business-V14.2-FULLSCREEN-AD.apk

          ls -lh Pani-Puri-Business-V14.2-FULLSCREEN-AD.apk


      # =========================================================
      # 13. UPLOAD APK ARTIFACT
      # =========================================================
      - name: Upload V14.2 APK
        uses: actions/upload-artifact@v4
        with:
          name: Pani-Puri-Business-V14.2-FULLSCREEN-AD
          path: Pani-Puri-Business-V14.2-FULLSCREEN-AD.apk
          if-no-files-found: error


      # =========================================================
      # 14. BUILD COMPLETE
      # =========================================================
      - name: Build Complete
        run: |
          echo ""
          echo "======================================"
          echo "✅ PANI PURI BUSINESS V14.2"
          echo "✅ FULL SCREEN ADVERTISEMENT"
          echo "✅ BUILD COMPLETED SUCCESSFULLY"
          echo "======================================"
