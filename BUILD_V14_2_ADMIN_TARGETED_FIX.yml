name: Build Pani Puri Business V14.2 - ADMIN TARGETED FIX

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build V14.2 Admin Fixed APK
    runs-on: ubuntu-latest

    steps:
      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout Repository
        uses: actions/checkout@v6

      # =========================================================
      # 2. DOWNLOAD CURRENT V14.2 SOURCE ZIP
      # =========================================================
      - name: Download V14.2 source ZIP
        shell: bash
        run: |
          set -e
          ZIP_URL="https://github.com/${{ github.repository }}/raw/refs/heads/main/Pani_Puri_Business_V14_2_ADMIN_DASHBOARD_FIX_5.zip"
          echo "Downloading:"
          echo "$ZIP_URL"
          curl -fL "$ZIP_URL" -o source.zip
          test -s source.zip
          echo "Source ZIP downloaded."

      # =========================================================
      # 3. EXTRACT SOURCE
      # =========================================================
      - name: Extract source
        shell: bash
        run: |
          set -e
          rm -rf android-project
          mkdir -p android-project
          unzip -q source.zip -d android-project

          PROJECT_DIR="$(find android-project -type f -name settings.gradle -o -name settings.gradle.kts | head -1 | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."
            find android-project -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      # =========================================================
      # 4. ADMIN-ONLY DATA FLOW PATCH
      # =========================================================
      - name: Apply Admin targeted fixes
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_DIR/app/src/main/assets/index.html"
          test -f "$FILE"

          cp "$FILE" "$FILE.before-admin-fix"

          python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          s = path.read_text(encoding="utf-8")

          # -----------------------------------------------------
          # A. Make Dashboard totals derive from real saved entries.
          # This avoids stale newCustomers/repeatCustomers counters
          # making Summary appear as 0 after migration/restore.
          # -----------------------------------------------------
          old = """ let total=state.entries.reduce((a,e)=>a+e.total,0),orders=state.entries.length,rep=state.repeatCustomers+state.newCustomers; if(!Array.isArray(state.expenses))state.expenses=[]; if(!Array.isArray(state.creditLedger))state.creditLedger=[];if(!Array.isArray(state.deletedEntries))state.deletedEntries=[];
          if(totalEl)totalEl.textContent=money(total);if(itemsEl)itemsEl.textContent=orders;if(avgEl)avgEl.textContent=money(orders?total/orders:0);if(repeatPctEl)repeatPctEl.textContent=(rep?Math.round(state.repeatCustomers/rep*100):0)+'%'; let expTotal=state.expenses.reduce((a,e)=>a+Number(e.amount||0),0); state.expense=expTotal; let exEl=document.getElementById('expenseTotal'),npEl=document.getElementById('netProfit'); if(exEl)exEl.textContent=money(expTotal); if(npEl)npEl.textContent=money(total-expTotal); renderCreditList();"""

          new = """ let total=state.entries.reduce((a,e)=>a+Number(e.total||0),0),orders=state.entries.length;
          let newCount=state.entries.filter(e=>e.customer==='नवीन').length;
          let repeatCount=state.entries.filter(e=>e.customer==='जुना'||e.customer==='Repeat').length;
          state.newCustomers=newCount;
          state.repeatCustomers=repeatCount;
          let rep=newCount+repeatCount;
          if(!Array.isArray(state.expenses))state.expenses=[];
          if(!Array.isArray(state.creditLedger))state.creditLedger=[];
          if(!Array.isArray(state.deletedEntries))state.deletedEntries=[];
          if(totalEl)totalEl.textContent=money(total);
          if(itemsEl)itemsEl.textContent=orders;
          if(avgEl)avgEl.textContent=money(orders?total/orders:0);
          if(repeatPctEl)repeatPctEl.textContent=(rep?Math.round(repeatCount/rep*100):0)+'%';
          let expTotal=state.expenses.reduce((a,e)=>a+Number(e.amount||0),0);
          state.expense=expTotal;
          let exEl=document.getElementById('expenseTotal'),npEl=document.getElementById('netProfit');
          if(exEl)exEl.textContent=money(expTotal);
          if(npEl)npEl.textContent=money(total-expTotal);
          renderCreditList();"""

          if old not in s:
              raise SystemExit("Dashboard block not found; stopping to avoid unsafe edit.")
          s = s.replace(old, new, 1)

          # -----------------------------------------------------
          # B. Expense Save: immediately persist + refresh Admin.
          # -----------------------------------------------------
          old = """ state.expenses.push(item);
          state.expense=state.expenses.reduce((x,e)=>x+Number(e.amount||0),0);
          save(STATE_KEY,state);
          localStorage.setItem('PP_V142_EXPENSES_MIRROR',JSON.stringify(state.expenses));
          v92SaveEverything();
          closeExpensePad();"""

          new = """ state.expenses.push(item);
          state.expense=state.expenses.reduce((x,e)=>x+Number(e.amount||0),0);
          save(STATE_KEY,state);
          localStorage.setItem('PP_V142_EXPENSES_MIRROR',JSON.stringify(state.expenses));
          localStorage.setItem('PP_V142_DELETED_MIRROR',JSON.stringify(state.deletedEntries||[]));
          v92SaveEverything();
          closeExpensePad();
          renderAdmin();"""

          if old not in s:
              raise SystemExit("Expense save block not found; stopping to avoid unsafe edit.")
          s = s.replace(old, new, 1)

          # -----------------------------------------------------
          # C. Expense Delete: keep all Admin mirrors in sync.
          # -----------------------------------------------------
          old = """function deleteExpense(id){id=String(id);let i=(state.expenses||[]).findIndex(x=>String(x.id)===id);if(i<0)return toast('❌ Expense सापडला नाही');let x=state.expenses[i];if(!confirm('हा Expense delete करायचा?\\n\\n'+money(x.amount)+' • '+(x.purpose||'Purpose नाही')))return;state.expenses.splice(i,1);state.expense=state.expenses.reduce((a,e)=>a+Number(e.amount||0),0);save(STATE_KEY,state);localStorage.setItem('PP_V142_EXPENSES_MIRROR',JSON.stringify(state.expenses));v92SaveEverything();renderAdmin();toast('✓ Expense deleted');queueDriveSync(false)}"""

          new = """function deleteExpense(id){
          id=String(id);
          let i=(state.expenses||[]).findIndex(x=>String(x.id)===id);
          if(i<0)return toast('❌ Expense सापडला नाही');
          let x=state.expenses[i];
          if(!confirm('हा Expense delete करायचा?\\n\\n'+money(x.amount)+' • '+(x.purpose||'Purpose नाही')))return;
          state.expenses.splice(i,1);
          state.expense=state.expenses.reduce((a,e)=>a+Number(e.amount||0),0);
          save(STATE_KEY,state);
          localStorage.setItem('PP_V142_EXPENSES_MIRROR',JSON.stringify(state.expenses));
          v92SaveEverything();
          renderAdmin();
          toast('✓ Expense deleted');
          queueDriveSync(false);
          }"""

          if old not in s:
              raise SystemExit("Expense delete block not found; stopping to avoid unsafe edit.")
          s = s.replace(old, new, 1)

          # -----------------------------------------------------
          # D. Entry Delete: also keep deleted-entry mirror current.
          # -----------------------------------------------------
          old = """ save(STATE_KEY,state);
          localStorage.setItem('PP_V142_ENTRIES_MIRROR',JSON.stringify(state.entries));
          renderAdmin();
          toast('✓ ENTRY DELETED • Recently Deleted मध्ये ठेवली');"""

          new = """ save(STATE_KEY,state);
          localStorage.setItem('PP_V142_ENTRIES_MIRROR',JSON.stringify(state.entries));
          localStorage.setItem('PP_V142_DELETED_MIRROR',JSON.stringify(state.deletedEntries||[]));
          renderAdmin();
          toast('✓ ENTRY DELETED • Recently Deleted मध्ये ठेवली');"""

          if old not in s:
              raise SystemExit("Entry delete block not found; stopping to avoid unsafe edit.")
          s = s.replace(old, new, 1)

          # -----------------------------------------------------
          # E. Restore: refresh every affected Admin mirror.
          # -----------------------------------------------------
          old = """save(STATE_KEY,state);localStorage.setItem('PP_V142_ENTRIES_MIRROR',JSON.stringify(state.entries));v92SaveEverything();renderAdmin();toast('✓ Entry restored');queueDriveSync(false)}"""

          new = """save(STATE_KEY,state);
          localStorage.setItem('PP_V142_ENTRIES_MIRROR',JSON.stringify(state.entries));
          localStorage.setItem('PP_V142_DELETED_MIRROR',JSON.stringify(state.deletedEntries||[]));
          v92SaveEverything();
          renderAdmin();
          toast('✓ Entry restored');
          queueDriveSync(false)}"""

          if old not in s:
              raise SystemExit("Restore block not found; stopping to avoid unsafe edit.")
          s = s.replace(old, new, 1)

          # -----------------------------------------------------
          # F. New Day: clear mirrors too, otherwise deleted/old
          # data can reappear after refresh/hydration.
          # -----------------------------------------------------
          old = """function newDay(){if(!confirm('आधी Backup केला आहे ना? Data reset करायचा आहे?'))return;state={entries:[],newCustomers:0,repeatCustomers:0,expense:0,expenses:[],creditLedger:[],deletedEntries:[]};save(STATE_KEY,state);v92SaveEverything();renderAdmin();toast('✓ NEW DAY STARTED');queueDriveSync(false)}"""

          new = """function newDay(){
          if(!confirm('आधी Backup केला आहे ना? Data reset करायचा आहे?'))return;
          state={entries:[],newCustomers:0,repeatCustomers:0,expense:0,expenses:[],creditLedger:[],deletedEntries:[]};
          save(STATE_KEY,state);
          localStorage.setItem('PP_V142_ENTRIES_MIRROR','[]');
          localStorage.setItem('PP_V142_EXPENSES_MIRROR','[]');
          localStorage.setItem('PP_V142_DELETED_MIRROR','[]');
          v92SaveEverything();
          renderAdmin();
          toast('✓ NEW DAY STARTED');
          queueDriveSync(false);
          }"""

          if old not in s:
              raise SystemExit("New Day block not found; stopping to avoid unsafe edit.")
          s = s.replace(old, new, 1)

          path.write_text(s, encoding="utf-8")
          print("ADMIN TARGETED FIX APPLIED")
          PY

          echo "Patch verification:"
          grep -n "ADMIN TARGETED FIX" "$FILE" || true
          grep -n "state.entries.filter" "$FILE"
          grep -n "PP_V142_DELETED_MIRROR" "$FILE"

      # =========================================================
      # 5. JAVA / GRADLE SETUP
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # =========================================================
      # 6. BUILD APK
      # =========================================================
      - name: Build V14.2 Admin Fixed APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon

      # =========================================================
      # 7. COPY APK
      # =========================================================
      - name: Prepare APK
        shell: bash
        run: |
          set -e
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk" -type f -name '*.apk' | head -1)"
          test -n "$APK"
          mkdir -p release
          cp "$APK" release/Pani-Puri-Business-V14.2-ADMIN-FIXED.apk
          echo "APK: $APK"
          ls -lh release/Pani-Puri-Business-V14.2-ADMIN-FIXED.apk

      # =========================================================
      # 8. VERIFY PACKAGE
      # =========================================================
      - name: Verify APK
        shell: bash
        run: |
          set -e
          APK="release/Pani-Puri-Business-V14.2-ADMIN-FIXED.apk"
          echo "APK created successfully:"
          ls -lh "$APK"
          echo "Package expected: com.panipuri.business"

      # =========================================================
      # 9. UPLOAD APK ARTIFACT
      # =========================================================
      - name: Upload V14.2 Admin Fixed APK
        uses: actions/upload-artifact@v4
        with:
          name: Pani-Puri-Business-V14.2-ADMIN-FIXED-APK
          path: release/Pani-Puri-Business-V14.2-ADMIN-FIXED.apk
          if-no-files-found: error
